name: Daily Race Scraping

on:
  schedule:
    # 毎日UTC 22:00 = 日本時間(JST) 07:00 に実行
    - cron: '45 21 * * *'
  workflow_dispatch: # 手動でActionを動かしたい時のための記述

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # jsonファイルをコミットしてプッシュするために必須

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # ご自身の環境に合わせてください

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas streamlit playwright
          playwright install chromium
          playwright install-deps
      - name: Run Scraping Script
        run: python app.py --scrape

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today_data.json
          # 差分がある場合のみコミットとプッシュを行う
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update: today_data.json" && git push)
